name: CI - Continuous Integration & Quality Checks

on:
  push:
    branches: [ main, master, feature/external-libraries-directory ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Lint, Test, Integrity & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate npm Lockfile
        run: |
          npm_config_package_lock=true npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json

      - name: Upload Generated npm Lockfile
        uses: actions/upload-artifact@v4
        with:
          name: MTA-University-Library-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Test Suite (Unit, Integration & Security)
        run: npm test

      - name: SQLite Relational Integrity & Schema Check
        run: npm run db:integrity

      - name: Vite Frontend Production Build
        run: npm run build
